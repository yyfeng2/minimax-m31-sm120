# MiniMax-M3.1-Flash 推理服务（RTX PRO 6000 ×4 / SM120 原生内核版）
# 镜像 minimax-m31-sm120-moe-native-reason5：v1 降级层 + v2 SM120 原生 FP4/FP8
#   稀疏 decode + v3 FlashInfer CUTLASS SM120 NVFP4 W4A4 MoE
#   + 五档 reasoning_effort（parser 烤进镜像，模板以模型目录为准，无 bind mount）
# 参数一律用 --key=value 单元素写法（参照 /opt/glm/docker-compose.yml）
# 上下文 512K、并发 8（--max-num-seqs=8）
# 启动：docker compose -p data -f /data/docker-compose-m31.yml up -d
services:
  minimax-m31:
    image: ${M31_IMAGE:-docker.m.daocloud.io/vllm/vllm-openai:minimax-m31-sm120-moe-native-reason5}
    container_name: minimax-m31
    restart: unless-stopped
    ipc: host
    network_mode: host
    environment:
      - MAX_JOBS=12
      - MINFER_FMHA_CACHE_DIR=/root/.cache/minfer
      - TORCH_EXTENSIONS_DIR=/root/.cache/torch_extensions
      # 设 0 回退 Triton 在线反量化注意力（v1 行为）
      - M3_SM120_NATIVE=${M3_NATIVE:-1}
      # 设 0 回退 MARLIN W4A16 反量化 MoE（A/B 用）
      - M3_SM120_MOE_W4A4=${M3_MOE_W4A4:-1}
    volumes:
      - /data/MiniMax-M3.1-Flash:/data/MiniMax-M3.1-Flash
      # JIT/CUDA graph 编译缓存持久化，换容器不重编
      - /data/vllm-cache/root-cache:/root/.cache
      # 思考层：parser 已烤进镜像（覆盖 vllm/reasoning/minimax_m3_reasoning_parser.py），
      # 不再挂载 /data/m3_patches。五档模板的权威副本在模型目录
      # /data/MiniMax-M3.1-Flash/chat_template.jinja（md5 f90d3923…）。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - /data/MiniMax-M3.1-Flash
      - --served-model-name=MiniMax-M3.1-Flash
      - --tensor-parallel-size=4
      - --max-model-len=1048576
      - --max-num-seqs=8
      - --gpu-memory-utilization=0.95
      - --kv-cache-dtype=nvfp4
      - --block-size=128
      - --attention-config={"indexer_kv_dtype":"fp8"}
      - --compilation-config={"cudagraph_mode":"FULL_AND_PIECEWISE"}
      - --speculative-config={"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}
      - --disable-hybrid-kv-cache-manager
      - --enable-auto-tool-choice
      # 模板权威副本在模型目录（/data/MiniMax-M3.1-Flash/chat_template.jinja，
      # md5 f90d3923…，五档），随模型目录挂载进容器，不再用 --chat-template。
      # 镜像内 /opt/m31/chat_template.jinja 是同一份副本，默认不启用；
      # 若要强制以镜像为准，取消下一行注释即可覆盖模型目录。
      # - --chat-template=/opt/m31/chat_template.jinja
      # 思考默认关闭；仅当客户端显式传 reasoning_effort 时才按档位开启：
      #   不传 / none / minimal -> 关闭，模板预填 </mm:think>，正文直出
      #   low / medium / high / xhigh / max -> 开启，模板预填 <mm:think>，
      #     档位越深指令越强，思考进 reasoning 字段
      # 服务端不设 default-chat-template-kwargs（否则等于默认开启思考）。
      # parser 读取同一份 chat_template_kwargs，保证流式与非流式切分一致。
      - --reasoning-parser=minimax_m3
      - --tool-call-parser=minimax_m3
      - --trust-remote-code
      - --api-key=REPLACE_WITH_YOUR_API_KEY
      - --host=0.0.0.0
      - --port=8000
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
