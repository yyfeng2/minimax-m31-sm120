# MiniMax-M3.1-Flash 推理服务（RTX PRO 6000 x4 / SM120）
# m31-sm120-native：nvfp4 KV + SM120 原生 FP4/FP8 张量核稀疏 decode（M3_SM120_NATIVE=0 回退 Triton 反量化）
#   - 主 KV：nvfp4（E2M1 码 + E4M3 block scale，132B/128tok/head->72B 页槽）
#   - indexer：fp8 + Triton indexer（nvfp4 indexer 仍需 SM100 cute 内核）
#   - dspark 草稿：FlashInfer XQA + fp8（SM120 上 Q 必须 bf16）
# 用法：docker compose -f /data/docker-compose-nvfp4.yml up -d
services:
  minimax-m31:
    image: ${M31_IMAGE:-docker.m.daocloud.io/vllm/vllm-openai:minimax-m31-sm120-moe-native}
    container_name: minimax-m31
    restart: unless-stopped
    ipc: host
    network_mode: host
    environment:
      - MAX_JOBS=12
      - MINFER_FMHA_CACHE_DIR=/root/.cache/minfer
      - TORCH_EXTENSIONS_DIR=/root/.cache/torch_extensions
      # 设 0 则回退 fp8 主 KV（v1 行为）；设 1 保留官方 nvfp4 路由（SM120 会崩，复现用）
      # - M3_SM120_NVFP4=0
      - M3_SM120_NATIVE=${M3_NATIVE:-1}
      - M3_SM120_MOE_W4A4=${M3_MOE_W4A4:-1}
      # - M3_SM120_KEEP_NVFP4=1
    volumes:
      - /data/MiniMax-M3.1-Flash:/data/MiniMax-M3.1-Flash
      - /data/vllm-cache/root-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command:
      - /data/MiniMax-M3.1-Flash
      - --max-model-len
      - "524288"
      - --tensor-parallel-size
      - "4"
      - --kv-cache-dtype
      - nvfp4
      - --attention-config
      - '{"indexer_kv_dtype": "fp8"}'
      - --compilation-config
      - '{"cudagraph_mode": "FULL_AND_PIECEWISE"}'
      - --speculative-config
      - '{"method":"dspark","num_speculative_tokens":7,"attention_backend":"FLASHINFER","kv_cache_dtype":"fp8","draft_sample_method":"probabilistic","rejection_sample_method":"block"}'
      - --block-size
      - "128"
      - --disable-hybrid-kv-cache-manager
      - --enable-auto-tool-choice
      - --reasoning-parser
      - minimax_m3
      - --tool-call-parser
      - minimax_m3
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --served-model-name
      - MiniMax-M3.1-Flash
